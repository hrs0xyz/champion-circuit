services:
  - type: web
    name: champion-circuit-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard
      - key: SECRET_KEY
        sync: false   # set manually in Render dashboard
      - key: BACKEND_CORS_ORIGINS
        sync: false   # e.g. https://your-app.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false   # your render URL e.g. https://champion-circuit-api.onrender.com
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false   # set manually in Render dashboard
      - key: AWS_SECRET_ACCESS_KEY
        sync: false   # set manually in Render dashboard
      - key: SES_FROM_EMAIL
        value: official@championcircuit.com
      - key: SES_FROM_NAME
        value: Champion Circuit
      - key: UPLOAD_DIR
        value: uploads
